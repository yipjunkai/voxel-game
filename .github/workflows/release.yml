name: Release

# Releases are cut by hand. To trigger this: bump the workspace version on a
# branch, merge that pull request, then sign a tag on the merged commit and push
# it.
#
# Nothing in this workflow writes to the repository. The only mutation is the
# Release object, so no bot needs push access and no automation authors a
# commit. Release notes are generated here from git history rather than read
# from a committed CHANGELOG.md, which is why no such file exists.
on:
  push:
    tags: ["v*"]
  # Dry run: builds and packages every platform, then stops. The publish job is
  # skipped entirely, so nothing is attested and no Release appears.
  #
  # Run this by hand before tagging. checks.yml is ubuntu-only and never builds
  # --release, so the Windows build, the macOS build, release-profile
  # compilation and archive packaging are exercised by nothing else.
  workflow_dispatch:

# Never cancel. A superseded run that dies mid-publish leaves a Release holding
# a subset of its archives, which is worse than two runs queuing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Read here, in the job that runs before everything else, so the manifest
      # is parsed once and build and publish cannot disagree. publish has no
      # Rust toolchain, so it cannot ask cargo itself -- and a bare `cargo`
      # there would send rustup after the pinned nightly.
      #
      # Only the version is read. The product name is hardcoded at each use
      # site below and carries a rename marker there; it changes once, if ever,
      # whereas this changes every release.
      - name: read workspace version
        id: version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version *= *"\(.*\)"/\1/p')
          if [ -z "$version" ]; then
            echo "could not read version from [workspace.package]" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # First of the two assertions that bound a tag, given its signature is not
      # verified. Guards the mistake manual tagging makes easy: signing v0.2.0
      # onto a commit whose manifest still says 0.1.0.
      - name: assert tag matches workspace version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $VERSION" >&2
            exit 1
          fi

      # Second bound: the tag must point into main's history. checks.yml is a
      # required status check, so nothing reaches main unvalidated, and proving
      # ancestry proves the commit passed -- for the price of one fetch rather
      # than a second full build.
      #
      # Together the two assertions mean a tag can only release a commit that
      # already went through review, at the version that commit declares. Even
      # a stolen contents:write token could at worst re-release approved code;
      # it cannot tag a side branch, and it cannot introduce new code without
      # first getting a pull request merged into main.
      - name: assert tag commit is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_REF_NAME^{commit}" origin/main; then
            echo "tag $GITHUB_REF_NAME points at a commit that is not on main" >&2
            exit 1
          fi

  build:
    name: build ${{ matrix.crate }} (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      # Not fail-fast: publish needs all four regardless, so cancelling the
      # survivors only hides which other platforms were also broken.
      fail-fast: false
      # `bin` must match the crate's [[bin]] name in its Cargo.toml. A drift
      # between the two is not silent: the build still succeeds, then the `cp`
      # in "stage archive contents" cannot find the file and fails the job.
      matrix:
        include:
          - crate: server
            bin: voxel-game-server # TODO(rename): product name
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            ext: tar.gz
            exe: ""
          - crate: client
            bin: voxel-game # TODO(rename): product name
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            ext: tar.gz
            exe: ""
          - crate: client
            bin: voxel-game # TODO(rename): product name
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            ext: zip
            exe: ".exe"
          # macos-latest is arm64 only, so Intel Macs are unserved.
          - crate: client
            bin: voxel-game # TODO(rename): product name
            runner: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            ext: tar.gz
            exe: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the client needs them
      - name: install client build dependencies
        if: matrix.crate == 'client' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          # Release builds are rare and must not inherit a poisoned cache from
          # a PR; the few minutes saved are not worth the ambiguity.
          cache: false

      - name: build
        run: >
          cargo build --release --locked
          --package ${{ matrix.crate }} --target ${{ matrix.target }}

      # Everything the archive will contain, under a single top-level directory
      # so extracting does not litter the user's cwd. LICENSE travels with the
      # binary because GPL-3.0 obliges us to convey it.
      - name: stage archive contents
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The archive prefix names the download a user sees. It is not derived
          # from a [[bin]] name: the client binary happens to share this string
          # today, and coupling them would mean renaming the client also renamed
          # the server's archives.
          name="voxel-game-${{ matrix.crate }}-v${VERSION}-${{ matrix.platform }}" # TODO(rename): product name
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"
          mkdir -p "staging/$name" dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}${{ matrix.exe }}" "staging/$name/"
          cp LICENSE README.md "staging/$name/"
          if [ "${{ matrix.crate }}" = "client" ]; then
            cp -R assets "staging/$name/"
          fi

      # tar preserves the executable bit; a bare download does not, and a zip
      # cannot carry it at all.
      - name: archive (tar.gz)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C staging "$ARCHIVE_NAME"

      # zip on Windows only, where Explorer opens it natively and mode bits are
      # meaningless anyway.
      - name: archive (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "staging/$env:ARCHIVE_NAME" -DestinationPath "dist/$env:ARCHIVE_NAME.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: [verify, build]
    # Tag pushes only. A dry run stops after build, so it never attests: an
    # attestation is a permanent public record, and a throwaway build has no
    # business leaving one signed against refs/heads/main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release
      id-token: write # OIDC identity Sigstore signs against
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # One attestation covering all four archives: the action folds multiple
      # subjects into a single statement. Runs before the bundle is copied into
      # dist/ so the glob cannot attest the attestation.
      #
      # SLSA Build L2
      - name: attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: attach attestation bundle
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        # TODO(rename): product name, in the bundle filename below.
        run: >
          cp "${{ steps.attest.outputs.bundle-path }}"
          "dist/voxel-game-v${VERSION}.sigstore.json"

      - uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          install-only: true

      # The changelog is generated here and published only to the Release. It is
      # never committed -- the git log is the changelog. `template = "remote"`
      # in cog.toml is what turns these entries into links.
      - name: generate release notes
        shell: bash
        run: |
          cog changelog --at "$GITHUB_REF_NAME" > notes.md

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file notes.md
          dist/*
